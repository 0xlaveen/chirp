# Builds the static site in site/ and publishes it to GitHub Pages (https://araa47.github.io/chirp/).
# Pull requests that touch the site only build it, which runs the link and privacy checks in site/build.py.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/screenshots/**"
      - "docs/assets/**"
      - "android/artwork/chirp-icons/approved*.png"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/screenshots/**"
      - "docs/assets/**"
      - "android/artwork/chirp-icons/approved*.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build site
        run: python3 site/build.py --out _site
      - name: Test public-site guardrails
        env:
          CHIRP_SITE_TEST_OUTPUT: _site
        run: python3 -m unittest discover -s site -p 'test_*.py'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
