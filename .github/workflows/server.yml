name: server

on:
  pull_request:
    paths: ["server/**", ".github/workflows/server.yml"]
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml"]
  workflow_dispatch:

concurrency:
  group: server-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      # MLX packages are darwin-only in pyproject, so Linux installs the portable dependencies.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # pyproject's addopts already deselects `-m model` tests (real cached models, Apple Silicon only).
      - run: uv run pytest -q

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: server
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv sync --locked --extra onnx
      # Temporary while finding a Windows-only hang: each file runs with its output in a file
      # (no shared pipe for an orphaned child to hold open) and its whole process tree is
      # killed after 150 s; a test that runs 45 s dumps every thread's stack.
      - name: pytest, file by file
        shell: python
        run: |
          import glob, os, subprocess, sys, tempfile, time
          failed = []
          for name in sorted(glob.glob("tests/test_*.py")):
              with tempfile.TemporaryFile() as out:
                  started = time.monotonic()
                  process = subprocess.Popen(
                      [".venv/Scripts/python.exe", "-m", "pytest", "-q", "-p", "no:cacheprovider",
                       "-o", "faulthandler_timeout=45", name],
                      stdout=out, stderr=subprocess.STDOUT, stdin=subprocess.DEVNULL,
                  )
                  try:
                      code = process.wait(150)
                  except subprocess.TimeoutExpired:
                      subprocess.run(["taskkill", "/T", "/F", "/PID", str(process.pid)],
                                     capture_output=True)
                      code = "timeout"
                  out.seek(0)
                  text = out.read().decode(errors="replace")
              print(f"::group::{name} -> {code} in {time.monotonic() - started:.0f}s", flush=True)
              print(text[-12000:], flush=True)
              print("::endgroup::", flush=True)
              if code not in (0, 5):
                  failed.append(f"{name}: {code}")
          print("\n".join(failed) or "all files passed", flush=True)
          sys.exit(1 if failed else 0)
        timeout-minutes: 30

  windows-onnx:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: server
    env:
      # Pinned by engine/models.py; the cache key carries the revision.
      CHIRP_ONNX_MODEL_DIR: ${{ github.workspace }}\onnx-model\parakeet-onnx
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv sync --locked --extra onnx
      - uses: actions/cache@v4
        id: model
        with:
          path: onnx-model
          key: onnx-parakeet-tdt-0.6b-v2-0bbb45a3365852604aef28b538a8f066f4ccaa85
      - name: Fetch the pinned ONNX Parakeet model
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          uv run python -c "
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              'istupakov/parakeet-tdt-0.6b-v2-onnx',
              revision='0bbb45a3365852604aef28b538a8f066f4ccaa85',
              local_dir=os.environ['CHIRP_ONNX_MODEL_DIR'],
              allow_patterns=['config.json', 'vocab.txt', '*-model.int8.onnx', 'nemo128.onnx'],
          )"
      # A real chirp-server process on a free port with a throwaway home: ONNX Parakeet
      # transcribes the committed synthetic clip over /v1/transcribe and /v1/stream.
      - run: timeout -k 10 480 .venv/Scripts/python.exe -m pytest -v -m onnx -rs -o faulthandler_timeout=240 tests/test_onnx_smoke.py
        timeout-minutes: 10
