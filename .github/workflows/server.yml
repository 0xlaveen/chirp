name: server

on:
  pull_request:
    paths: ["server/**", ".github/workflows/server.yml"]
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml"]
  workflow_dispatch:

concurrency:
  group: server-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      # MLX packages are darwin-only in pyproject, so Linux installs the portable dependencies.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # pyproject's addopts already deselects `-m model` tests (real cached models, Apple Silicon only).
      - run: uv run pytest -q
