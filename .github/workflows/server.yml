name: server

on:
  pull_request:
    paths: ["server/**", ".github/workflows/server.yml"]
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml"]
  workflow_dispatch:

concurrency:
  group: server-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      # MLX packages are darwin-only in pyproject, so Linux installs the portable dependencies.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # pyproject's addopts already deselects `-m model` tests (real cached models, Apple Silicon only).
      - run: uv run pytest -q

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: server
    env:
      # Pinned by engine/models.py; the cache key carries the revision.
      CHIRP_ONNX_MODEL_DIR: ${{ github.workspace }}\onnx-model\parakeet-onnx
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv sync --locked --extra onnx
      # Each file under its own time limit, so one hang cannot hide the others; a test that
      # runs for a minute dumps every thread's stack.
      - name: pytest, file by file
        run: |
          status=0
          for file in tests/test_*.py; do
            echo "::group::$file"
            timeout -k 10 240 .venv/Scripts/python.exe -m pytest -q -p no:cacheprovider \
              -o faulthandler_timeout=60 "$file" || { code=$?; echo "FAILED $file ($code)"; status=1; }
            echo "::endgroup::"
          done
          exit $status
        timeout-minutes: 25
      - uses: actions/cache@v4
        id: model
        with:
          path: onnx-model
          key: onnx-parakeet-tdt-0.6b-v2-0bbb45a3365852604aef28b538a8f066f4ccaa85
      - name: Fetch the pinned ONNX Parakeet model
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          uv run python -c "
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              'istupakov/parakeet-tdt-0.6b-v2-onnx',
              revision='0bbb45a3365852604aef28b538a8f066f4ccaa85',
              local_dir=os.environ['CHIRP_ONNX_MODEL_DIR'],
              allow_patterns=['config.json', 'vocab.txt', '*-model.int8.onnx', 'nemo128.onnx'],
          )"
      # A real chirp-server process on a free port with a throwaway home: ONNX Parakeet
      # transcribes the committed synthetic clip over /v1/transcribe and /v1/stream.
      - run: uv run pytest -q -m onnx -rs -o faulthandler_timeout=240
        timeout-minutes: 10
